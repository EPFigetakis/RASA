name: CI and Deploy

on:
  push:
    branches:
      - main
      - test        # change to your actual test branch name
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Run unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'  # change if needed

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          pytest      # or whatever command you use for tests

  deploy:
  
    name: Deploy to server
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: self-hosted
  
    steps:
      - name: Debug whoami & sudo -l
        run: |
          echo "WHOAMI:"
          whoami
          echo
          echo "ID:"
          id
          echo
          echo "WHICH SYSTEMCTL:"
          which systemctl || echo "systemctl not in PATH"
          echo
          echo "SUDO -L:"
          sudo -l
  
      - name: Pull latest code on server and restart Streamlit
        run: |
          cd /srv/streamlit-app
          git pull
          sudo -n systemctl restart streamlit.service